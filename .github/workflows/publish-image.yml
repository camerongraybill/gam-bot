name: Publish image

# Only runs for commits on main, so pull requests, including ones from forks, can't publish.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    # Actions are pinned to commits because this job can publish images.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # dunamai needs the tags and history to work out the version.
        fetch-depth: 0
        persist-credentials: false

    - id: version
      run: |
        python -m venv ./venv
        ./venv/bin/pip install dunamai==1.22.0
        echo "APP_VERSION=$(./venv/bin/dunamai from git --style pep440)" >> "$GITHUB_OUTPUT"
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        # The main-<timestamp>-<sha> tag sorts by time, so Flux can pick the newest one.
        tags: |
          ghcr.io/camerongraybill/gam-bot:latest
          ghcr.io/camerongraybill/gam-bot:${{ steps.version.outputs.SHORT_SHA }}
          ghcr.io/camerongraybill/gam-bot:main-${{ steps.version.outputs.TIMESTAMP }}-${{ steps.version.outputs.SHORT_SHA }}
        labels: |
          org.opencontainers.image.source=https://github.com/camerongraybill/gam-bot
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          APP_VERSION=${{ steps.version.outputs.APP_VERSION }}
